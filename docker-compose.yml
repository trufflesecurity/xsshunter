services:
  # XSS Hunter Express service
  xsshunterexpress:
    build: .
    env_file:
      - config.env
    volumes:
      # Directory where payload fire images are stored.
      - payload-fire-images:/app/payload-fire-images:rw
      - ~/.config/gcloud/application_default_credentials.json:/gcloud.json:ro
    depends_on:
      postgresdb:
        condition: service_healthy
  postgresdb:
    image: postgres:16
    restart: always
    env_file:
      - config.env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-db-data:/var/lib/postgresql/data/pgdata:rw
  caddy:
    image: caddy:2
    restart: always
    env_file:
      - config.env
    ports:
      - "${API_PORT}:${API_PORT}"
      - "${PORT}:${PORT}"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile


volumes:
  payload-fire-images:
  postgres-db-data:
